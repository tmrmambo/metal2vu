# 本项目自有 workspace 的编译检查。
#
# 开发机是 Windows 且没有 MSVC 链接器，所以这件事只能在 CI 上做
# （docs/spec/91-RUNTIME-EVIDENCE.md 的 R-009）。
#
# 目标三元组是 x86_64-apple-darwin：组件 1（Metal plugin bundle）与组件 4
# （IOSurface 桥）只在 macOS 上有意义，组件 7（harness）跑在 host 侧。

name: check

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: cargo check (x86_64-apple-darwin)
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-x86_64-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
      - run: rustc --version && cargo --version
      - name: cargo check
        run: cargo check --workspace --all-targets
      # apfs_seal.c 是 V-034 的实验载体（78 §A.10.2d）。它只在 macOS 上编得过
      # （要 <sys/snapshot.h>），所以检查放这个 job。语法错不该等到 forensics 那一轮。
      - name: tools/seal/apfs_seal.c 编译与自检
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra -Werror -o /tmp/apfs_seal tools/seal/apfs_seal.c
          echo "--- 链接到的 fs_snapshot_* 符号 ---"
          nm -u /tmp/apfs_seal | grep -i snapshot
          echo "--- 用法串（期望退出码 2）---"
          /tmp/apfs_seal && rc=0 || rc=$?
          test "$rc" = "2" || { echo "期望退出码 2，实际 $rc"; exit 1; }
          echo "--- 护栏：对 / 必须被拒（期望退出码 2）---"
          /tmp/apfs_seal create / selftest && rc=0 || rc=$?
          test "$rc" = "2" || { echo "护栏没拦住 /，退出码 $rc"; exit 1; }
          echo "OK"

      - name: cargo clippy
        continue-on-error: true
        run: |
          rustup component add clippy || true
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tail -60
      - name: cargo test（只跑不需要 guest 的）
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tail -40
      - name: cargo fmt
        continue-on-error: true
        run: |
          rustup component add rustfmt || true
          cargo fmt --all --check

  linux:
    name: cargo check (host tools only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
      # harness 跑在 host 侧，Linux 上必须能编（L1 的 QEMU 宿主是 Linux）
      - run: cargo check -p harness --all-targets

  python:
    name: tools/*.py 自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - name: 语法检查
        run: |
          set -euo pipefail
          fail=0
          for f in $(find tools -name '*.py'); do
            python3 -m py_compile "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail
      - name: verify_kernel_patches.py 的 --help 可用
        run: python3 tools/verify_kernel_patches.py --help > /dev/null

      # mkgpt.py 写的是启动盘的分区表。它错一个字节，整块镜像启不起来，
      # 而且症状是「OpenCore 选择器里没有 macOS」这种最难归因的一类
      # （78 §C.1 L0-11 / 76 §1.3 判据 1）。所以它的自检是必过项，不是 continue-on-error。
      - name: mkgpt.py 自检（GUID 字节序、CRC32、几何、往返、篡改检出）
        run: python3 tools/ci/mkgpt.py selftest

      # mkbootsector.py 是嵌套虚拟化判定的「证据生产端」。它错一个相对位移，
      # 症状是「QEMU 下串口文件空」—— 而那跟「HVF 不可用」长得一模一样，
      # 会把一次本该归因到 hypervisor 的判定污染成我们自己的 bug。
      # 它的自检里有个 16 位解释器，检查的是行为而不是字节，所以是必过项。
      - name: mkbootsector.py 自检（黄金向量、解释器跑一遍、承重字节图）
        run: python3 tools/ci/mkbootsector.py selftest

      - name: mkgpt.py → gptdump.py 的端到端一致性
        run: |
          set -euo pipefail
          python3 tools/ci/mkgpt.py create /tmp/ci.raw --size 8GiB --esp 512MiB \
                  --disk-guid 4D324755-0000-4000-8000-000000000001
          python3 tools/ci/mkgpt.py verify /tmp/ci.raw
          python3 tools/ci/gptdump.py /tmp/ci.raw
          # ESP 必须正好 512 MiB 且从 1 MiB 边界起（75 §0.0.1 的两条硬要求）
          python3 tools/ci/gptdump.py /tmp/ci.raw | grep -q 'LBA 2048\.\.1050623'
          echo "ESP 起止 LBA 符合 75 §0.0.1"

      # workflow 里内嵌了几百行 bash。一个括号配错就是一次 CI 往返
      # （macOS runner 上 forensics 那个 job 一轮 45 分钟）。
      - name: workflow 内嵌 shell 的语法检查
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/ci/lint_workflow_shell.py
