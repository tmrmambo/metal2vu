# 在 macos-26-intel 上构建 Vulkan loader + Mesa/Lavapipe（x86_64）。
#
# 这是 docs/spec/70-BUILD-PACKAGE.md 第 3.4 节与 80-TEST-HARNESS.md 第 5.4 节
# 登记的风险："Lavapipe 在 x86_64 macOS 上的可建性尚未验证"。存在 arm64 macOS
# 的成功先例，x86_64 没有。它阻塞 metal-probe，而 metal-probe 是 T2 的唯一判据。
#
# metal2vulkan-runtime 不链接 Vulkan，运行时才打开 loader（上游 README）。
# 所以 loader 与 ICD 都是本项目自己的交付物，这个 workflow 就是那条产线。
#
# 发布边界：这里构建的全部是上游开源件（Mesa 是 MIT，Vulkan-Loader 是 Apache-2.0），
# 产物可以作为 artifact 上传。不涉及任何 Apple 二进制。

name: build-lavapipe-macos

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa 的 git ref
        default: mesa-25.3.2
      loader_ref:
        description: Vulkan-Loader 的 git ref
        default: v1.4.321

permissions:
  contents: read

env:
  MESA_REF: ${{ github.event.inputs.mesa_ref || 'mesa-25.3.2' }}
  LOADER_REF: ${{ github.event.inputs.loader_ref || 'v1.4.321' }}

jobs:
  build:
    name: Vulkan loader + Lavapipe (x86_64)
    runs-on: macos-26-intel
    timeout-minutes: 150
    steps:
      - name: 环境
        run: |
          set -x
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          clang --version | head -3

      # 关键：只用运行器**预装**的 LLVM，绝不让 brew 从源码编。
      #
      # 第一次跑这条 workflow 时写的是 `brew install llvm@19`，而
      # macos-26-intel 镜像预装的是 llvm@20（见 runner-images 的
      # macos-26-Readme.md：「Clang/LLVM (Homebrew) 20.1.8 - available on
      # $(brew --prefix llvm@20)/bin/clang」）。llvm@19 没有 bottle，brew
      # 转去从源码编 LLVM，整个 job 在这一步卡了一个多小时还没出来。
      #
      # 所以这里**先探测再决定**，并且在找不到可用 llvm-config 时直接失败，
      # 而不是退回 `brew install llvm`（那又会从源码编）。
      - name: 探测预装的 LLVM
        id: llvm
        run: |
          set -euo pipefail
          LP=""
          for cand in llvm@20 llvm@21 llvm; do
            p=$(brew --prefix "$cand" 2>/dev/null || true)
            if [ -n "$p" ] && [ -x "$p/bin/llvm-config" ]; then LP="$p"; break; fi
          done
          if [ -z "$LP" ]; then
            echo "::error::运行器上没有预装可用的 llvm-config。"
            echo "不从源码编 LLVM —— 那会让 job 超时。"
            echo "可用的 brew LLVM formula："
            brew list --formula 2>/dev/null | grep -i llvm || echo "  (none)"
            exit 1
          fi
          echo "prefix=$LP" >> "$GITHUB_OUTPUT"
          echo "LLVM prefix: $LP"
          "$LP/bin/llvm-config" --version
          "$LP/bin/llvm-config" --host-target
          echo "---- Mesa 的 llvmpipe 需要的组件 ----"
          "$LP/bin/llvm-config" --components | tr ' ' '\n' | grep -E '^(x86|native|mcjit|orcjit|engine|analysis|bitwriter|ipo|instrumentation)$' || true
          echo "---- 共享还是静态 ----"
          ls "$LP/lib" | grep -E '^libLLVM' | head -5
          file "$LP/bin/llvm-config"

      # glslang 提供 glslangValidator。Mesa 的 meson.build:641 无条件要它
      # （第一次跑在这里失败：`ERROR: Program 'glslangValidator' not found`）。
      # 它不是可选项，lavapipe 要用它编内部着色器。
      - name: 其余工具链（全部有 bottle，不会编源码）
        run: |
          set -euo pipefail
          brew install --quiet meson ninja pkg-config bison flex glslang || true
          meson --version
          ninja --version
          cmake --version | head -1
          echo "---- glslangValidator ----"
          command -v glslangValidator && glslangValidator --version | head -3

      - name: 确认 Mesa 要的外部程序都在
        run: |
          set -euo pipefail
          miss=0
          for p in glslangValidator meson ninja pkg-config bison flex python3; do
            if command -v "$p" > /dev/null; then
              printf 'ok   %s -> %s\n' "$p" "$(command -v "$p")"
            else
              printf 'MISS %s\n' "$p"; miss=1
            fi
          done
          exit $miss

      # ---------------- Vulkan loader ----------------
      - name: 取 Vulkan-Loader
        run: git clone --depth 1 --branch "$LOADER_REF" https://github.com/KhronosGroup/Vulkan-Loader.git /tmp/loader

      - name: 构建 Vulkan-Loader
        id: buildloader
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /tmp/loader
          python3 scripts/update_deps.py --dir external --arch x64 --config release
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/stage \
            -DVULKAN_HEADERS_INSTALL_DIR="$(pwd)/external/Vulkan-Headers/build/install" \
            -DBUILD_TESTS=OFF
          ninja -C build -j"$(sysctl -n hw.ncpu)"
          ninja -C build install
          echo "---- 产物 ----"
          find /tmp/stage -name 'libvulkan*' -maxdepth 3
          otool -L /tmp/stage/lib/libvulkan.dylib | head -20

      # ---------------- Mesa / Lavapipe ----------------
      - name: 取 Mesa
        run: |
          git clone --depth 1 --branch "$MESA_REF" https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa \
            || git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa
          git -C /tmp/mesa log --oneline -1

      - name: Mesa 构建依赖
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --quiet mako pyyaml packaging || \
          python3 -m pip install --quiet mako pyyaml packaging
          python3 -c 'import mako; print("mako", mako.__version__)'

      - name: 配置 Mesa（lavapipe，仅 x86_64）
        id: mesaconf
        continue-on-error: true
        run: |
          set -euo pipefail
          LP="${{ steps.llvm.outputs.prefix }}"
          export PATH="$LP/bin:$PATH"
          export CC=clang CXX=clang++
          export LLVM_CONFIG="$LP/bin/llvm-config"
          cd /tmp/mesa
          meson setup build \
            --prefix=/tmp/stage \
            --buildtype=release \
            -Dvulkan-drivers=swrast \
            -Dgallium-drivers=llvmpipe \
            -Dplatforms= \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            2>&1 | tee /tmp/meson-setup.log
          echo "---- 配置摘要 ----"
          tail -60 /tmp/meson-setup.log

      # PATH 必须和配置步骤一致。
      #
      # 第三次跑在这里失败：ninja 到 758/786 时
      #   rm -f ... && llvm-ar csrD src/c11/impl/libmesa_util_c11.a ...
      #   /bin/sh: llvm-ar: command not found      (exit 127)
      #
      # meson 在配置期把归档器记成了裸名 `llvm-ar`（当时 $LP/bin 在 PATH 上
      # 所以找得到），而构建步骤是另一个 shell、没有 export 同样的 PATH。
      # 这类错误只在「配置与构建分成两个 step」时出现，本地连续跑不会遇到。
      - name: 构建 Mesa
        id: mesabuild
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="${{ steps.llvm.outputs.prefix }}/bin:$PATH"
          command -v llvm-ar llvm-ranlib llvm-config
          cd /tmp/mesa
          ninja -C build -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200
          ninja -C build install
          echo "---- 产物 ----"
          find /tmp/stage -name '*lvp*' -o -name '*lavapipe*' | head
          find /tmp/stage -name '*.json' | head

      # ---------------- 验证 ----------------
      - name: 跑一次 vulkaninfo 式自检
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /tmp/stage -name 'lvp_icd*.json' | head -1)
          export DYLD_LIBRARY_PATH=/tmp/stage/lib
          echo "ICD=$VK_ICD_FILENAMES"
          cat "$VK_ICD_FILENAMES" || true
          cat > /tmp/probe.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <dlfcn.h>
          #include <stdint.h>
          typedef struct { uint32_t apiVersion, driverVersion, vendorID, deviceID, deviceType;
                           char deviceName[256]; } PropsHead;
          int main(void) {
            void *h = dlopen("/tmp/stage/lib/libvulkan.dylib", RTLD_NOW);
            if (!h) { printf("dlopen loader FAILED: %s\n", dlerror()); return 1; }
            printf("loader opened OK\n");
            void *gipa = dlsym(h, "vkGetInstanceProcAddr");
            printf("vkGetInstanceProcAddr = %p\n", gipa);
            void *ci = dlsym(h, "vkCreateInstance");
            printf("vkCreateInstance = %p\n", ci);
            return (gipa && ci) ? 0 : 2;
          }
          EOF
          clang -arch x86_64 -o /tmp/probe /tmp/probe.c
          /tmp/probe

      - name: 汇总结论
        if: always()
        run: |
          mkdir -p out
          {
            echo "# Lavapipe on x86_64 macOS — 构建结论"
            echo
            echo "- runner: $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m)"
            echo "- mesa ref: $MESA_REF"
            echo "- loader ref: $LOADER_REF"
            echo "- llvm: $("${{ steps.llvm.outputs.prefix }}/bin/llvm-config" --version 2>/dev/null || echo unknown)"
            echo
            echo "| 步骤 | 结果 |"
            echo "|---|---|"
            echo "| Vulkan-Loader 构建 | ${{ steps.buildloader.outcome }} |"
            echo "| Mesa meson setup | ${{ steps.mesaconf.outcome }} |"
            echo "| Mesa ninja 构建 | ${{ steps.mesabuild.outcome }} |"
            echo "| loader dlopen 自检 | ${{ steps.smoke.outcome }} |"
          } > out/CONCLUSION.md
          cat out/CONCLUSION.md
          cp /tmp/meson-setup.log out/ 2>/dev/null || true
          find /tmp/stage -type f 2>/dev/null | sed 's|/tmp/stage/||' > out/stage-manifest.txt || true
          find /tmp/mesa/build -name '*.json' 2>/dev/null | head -20 >> out/stage-manifest.txt || true
          wc -l out/stage-manifest.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavapipe-build-report
          path: out/
          if-no-files-found: warn

      - name: 打包产物（构建成功时）
        if: steps.mesabuild.outcome == 'success'
        run: |
          cd /tmp && tar czf lavapipe-macos-x86_64.tar.gz stage
          ls -la /tmp/lavapipe-macos-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        if: steps.mesabuild.outcome == 'success'
        with:
          name: lavapipe-macos-x86_64
          path: /tmp/lavapipe-macos-x86_64.tar.gz
